<!doctype html>
<html lang="nl">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="f05-opnemen-template">
      <style>
        #f05-laag { position: absolute; inset: 0; }
        #f05-in .waarde { position: absolute; left: 0; top: 0; }
      </style>
      <div id="f05-opnemen" data-composition-id="f05-opnemen" data-width="1920" data-height="1080">
        <div class="sc-in" id="f05-in">
          <div id="f05-laag" data-layout-allow-occlusion><div class="cam" id="f05-cam"></div></div>
          <div class="hfd-groot" id="f05-hg"><div class="kick">Stap 2</div><div class="tit">Neem je beweging op</div></div>
          <div class="hfd-klein" id="f05-hk"><span class="kick">Stap 2</span><span>Neem je beweging op</span></div>
        </div>
      </div>
      <script>
        (function () {
          var ID = "f05-opnemen";
          var tl = UI.tijdlijn();
          var root = document.getElementById("f05-in");
          var T = UI.tijden(ID);
          var $ = function (s) { return root.querySelector(s); };
          var cam = $("#f05-cam");
          var v = Studio.verken("f05");
          cam.appendChild(v.el);
          var R = new UI.Regie(tl, root, { cursor: [900, 900] });
          var gez = $("#f05-gezicht");
          Gezicht.maak(gez);

          var ks = T.c("klikStart"), kp = T.c("klikStop"), km = T.c("klikMaken");

          R.hoofdstuk($("#f05-hg"), $("#f05-hk"), 0.1, 1.2);
          tl.set("#f05-laag", { opacity: 0 }, 0);
          tl.fromTo("#f05-laag", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "none", immediateRender: false }, 1.3);
          R.camDirect(v.r.venster.concat([1720, 760]), 0);

          // status en knoppen wisselen zoals in Studio
          UI.wissel(tl, [$("#f05-s1"), $("#f05-s2"), $("#f05-s3")], [[0, 0], [ks + 0.05, 1], [kp + 0.05, 2]]);
          UI.wissel(tl, [$("#f05-k1"), $("#f05-k2"), $("#f05-k3")], [[0, 0], [ks + 0.12, 1], [kp + 0.12, 2]]);

          // waarden: per balk twee teksten (rust / piek)
          var RUST = ["0.03", "0.01", "0.02", "0.01"], PIEK = ["0.71", "0.02", "0.05", "0.04"];
          var waarden = [0, 1, 2, 3].map(function (i) {
            var bw = document.getElementById("f05-bw" + i);
            bw.innerHTML = '<span class="waarde">' + RUST[i] + '</span><span class="waarde">' + PIEK[i] + '</span>';
            return bw.querySelectorAll(".waarde");
          });
          var balk = [0, 1, 2, 3].map(function (i) { return document.getElementById("f05-bf" + i); });
          tl.set(balk[0], { scaleX: 0.03 }, 0);
          [1, 2, 3].forEach(function (i) { tl.set(balk[i], { scaleX: 0.01 }, 0); });

          // gezicht: een paar keer de mond open tijdens de opname
          var N = { open: 0, lach: 0.3 }, O = { open: 1, lach: 0 };
          var stappen = [[1.0, { knip: 1, lach: 0.3 }, 0.09], [1.09, N, 0.12]];
          var wissels = [];
          var t = ks + 0.85, eerste = null;
          while (t + 0.9 < kp - 0.2) {
            stappen.push([t, O, 0.35]);
            stappen.push([t + 0.6, N, 0.35]);
            if (eerste === null) eerste = t;
            [0, 1, 2, 3].forEach(function (i) {
              var top = i === 0 ? 0.71 : parseFloat(PIEK[i]), rust = i === 0 ? 0.03 : 0.01;
              tl.fromTo(balk[i], { scaleX: rust }, { scaleX: top, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
              tl.fromTo(balk[i], { scaleX: top }, { scaleX: rust, duration: 0.35, ease: "power2.inOut", immediateRender: false }, t + 0.6);
            });
            wissels.push([t + 0.15, 1], [t + 0.75, 0]);
            t += 1.3;
          }
          Gezicht.reeks(tl, gez, N, stappen);
          // na de opname blijven de piekwaarden staan
          wissels.push([kp + 0.05, 1]);
          waarden.forEach(function (lijst) { UI.wissel(tl, lijst, [[0, 0]].concat(wissels)); });
          [0, 1, 2, 3].forEach(function (i) {
            var top = i === 0 ? 0.71 : parseFloat(PIEK[i]), rust = i === 0 ? 0.03 : 0.01;
            tl.fromTo(balk[i], { scaleX: rust }, { scaleX: top, duration: 0.3, ease: "power2.out", immediateRender: false }, kp + 0.05);
          });
          // de sterkste beweging wordt geel
          tl.set(["#f05-bl0", "#f05-bw0"], { color: "#9A9A9A" }, 0);
          tl.set(balk[0], { backgroundColor: "#777777" }, 0);
          tl.set(["#f05-bl0", "#f05-bw0"], { color: "#FFFF00" }, eerste + 0.25);
          tl.set(balk[0], { backgroundColor: "#FFFF00" }, eerste + 0.25);

          // regie
          R.naar(518, 760, ks - 0.1, 0.9);
          R.klik(ks, $("#f05-k1").firstChild);
          R.toonCursor(ks + 0.6, false);
          R.camera(v.r.paneel.concat([1500, 760]), T.w("sterkste") - 0.45, 1.0);
          R.camera(v.r.venster.concat([1720, 760]), kp - 1.0, 0.8);
          R.naar(960, 760, kp - 0.1, 0.7);
          R.klik(kp, $("#f05-k2").firstChild);
          R.camera([160, 600, 900, 220, 1720, 760], kp + 0.3, 0.9);
          R.naar(364, 760, km - 0.1, 0.8);
          R.klik(km, $("#f05-k3").firstChild);
          R.toonCursor(km + 0.6, false);
          R.camera(v.r.venster.concat([1720, 760]), km + 0.4, 1.0);

          R.fade(root, T.duur);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
