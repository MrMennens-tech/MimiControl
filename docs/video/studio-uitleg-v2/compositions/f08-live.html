<!doctype html>
<html lang="nl">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="f08-live-template">
      <style>
        #f08-laag { position: absolute; inset: 0; }
      </style>
      <div id="f08-live" data-composition-id="f08-live" data-width="1920" data-height="1080">
        <div class="sc-in" id="f08-in">
          <div id="f08-laag" data-layout-allow-occlusion><div class="cam" id="f08-cam"></div></div>
          <div class="hfd-klein" id="f08-hk"><span class="kick">Gebruiken</span><span>Live modus</span></div>
        </div>
      </div>
      <script>
        (function () {
          var ID = "f08-live";
          var tl = UI.tijdlijn();
          var root = document.getElementById("f08-in");
          var T = UI.tijden(ID);
          var $ = function (s) { return root.querySelector(s); };
          var cam = $("#f08-cam");
          var bo = Studio.bord("f08"), da = Studio.dashboard("f08", { kaart: true, drempel: "0.60" }),
            pn = Studio.paneel("f08"), ov = Studio.overlay("f08");
          [bo.el, da.el, pn.el, ov.el].forEach(function (e) { cam.appendChild(e); });
          UI.boven(da.el); UI.boven(pn.el); UI.boven(ov.el); UI.boven($("#f08-hk"));
          var ringOv = UI.h('<div class="ring" style="left:1406px;top:14px;width:500px;height:290px;border-width:4px;border-radius:10px"></div>');
          var ringBadge = UI.h('<div class="ring" style="left:1418px;top:214px;width:196px;height:56px;border-width:2.5px;border-radius:8px"></div>');
          cam.appendChild(ringOv); cam.appendChild(ringBadge);
          var R = new UI.Regie(tl, root, { cursor: [1350, 740] });
          var gez = $("#f08-ovgez");
          Gezicht.maak(gez);

          var kl = T.c("klikLive"), kc = T.c("klikComm"), ta = T.c("toetsA"), tb = T.c("toetsB");

          tl.set("#f08-hk", { opacity: 0, x: -20 }, 0);
          tl.fromTo("#f08-hk", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.25);

          // Live modus starten
          R.camDirect([1270, 608, 416, 296, 1000, 700], 0);
          R.toonCursor(0.15);
          R.naar(1478, 802, kl - 0.1, 0.8);
          R.klik(kl, $("#f08-liveknop"));
          tl.set(bo.el, { opacity: 0 }, 0);
          tl.fromTo(bo.el, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none", immediateRender: false }, kl + 0.35);
          tl.fromTo(da.el, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.97, duration: 0.5, ease: "power2.in", immediateRender: false }, kl + 0.3);
          R.camera({ x: 0, y: 0, s: 1 }, kl + 0.3, 1.1);

          // klein camerabeeld + drempelpaneel verschijnen rechtsboven
          tl.set([ov.el, pn.el], { opacity: 0 }, 0);
          var rb = T.w("rechtsboven");
          tl.fromTo(ov.el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false, transformOrigin: "100% 0%" }, rb - 0.1);
          tl.fromTo(pn.el, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false, transformOrigin: "100% 0%" }, rb + 0.2);
          R.camera([990, 20, 910, 590, 1720, 760], T.w("verschijnt"), 1.0);
          var bl = T.w("blijft");
          tl.set(ringOv, { opacity: 0 }, 0);
          tl.fromTo(ringOv, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, bl);
          tl.fromTo(ringOv, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "none", immediateRender: false }, bl + 1.6);

          // klik op Communicator 5 → actief venster
          R.camera({ x: 0, y: 0, s: 1 }, kc - 1.35, 0.9);
          R.naar(588, 600, kc - 0.1, 1.0);
          R.klik(kc);
          R.toonCursor(kc + 0.45, false);
          tl.set("#f08-ban2", { opacity: 0 }, 0);
          tl.fromTo("#f08-ban1", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "none", immediateRender: false }, kc + 0.35);
          tl.fromTo("#f08-ban2", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none", immediateRender: false }, kc + 0.45);
          R.camera(pn.r.banner.concat([1500, 600]), kc + 0.15, 1.0);
          // Communicator staat op volledig scherm vooraan: het paneel verdwijnt erachter
          var vol = T.w("volledig");
          tl.fromTo(pn.el, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.in", immediateRender: false }, vol - 0.9);
          R.camera({ x: 0, y: 0, s: 1 }, vol - 0.6, 1.0);

          // beweging → toets verstuurd
          R.camera([1416, 24, 480, 270, 1200, 680], T.w("maak") - 0.45, 1.0);
          var N = { open: 0, lach: 0.3 }, O = { open: 1, lach: 0 };
          Gezicht.reeks(tl, gez, N, [
            [5.5, { knip: 1, lach: 0.3 }, 0.09], [5.59, N, 0.12],
            [ta - 0.45, O, 0.3], [ta + 0.5, N, 0.35],
            [tb - 0.45, O, 0.3], [tb + 0.5, N, 0.35]
          ]);
          var scan = $("#f08-scan");
          var c0 = bo.cel(0), c1 = bo.cel(1), c2 = bo.cel(2);
          tl.set(scan, { x: c0[0], y: c0[1] }, 0);
          tl.fromTo(scan, { x: c0[0] }, { x: c1[0], duration: 0.3, ease: "power2.inOut", immediateRender: false }, ta + 0.05);
          tl.fromTo(scan, { x: c1[0] }, { x: c2[0], duration: 0.3, ease: "power2.inOut", immediateRender: false }, tb + 0.05);
          tl.set(["#f08-ovbadge", "#f08-ovrand"], { opacity: 0 }, 0);
          [ta, tb].forEach(function (t) {
            tl.set(["#f08-ovbadge", "#f08-ovrand"], { opacity: 1 }, t);
            tl.set(["#f08-ovbadge", "#f08-ovrand"], { opacity: 0 }, t + 2.0);
          });
          var lo = T.w("linksonder");
          tl.set(ringBadge, { opacity: 0 }, 0);
          tl.fromTo(ringBadge, { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, lo);
          tl.fromTo(ringBadge, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "none", immediateRender: false }, ta + 1.9);
          R.camera({ x: 0, y: 0, s: 1 }, tb + 1.0, 1.1);

          R.fade(root, T.duur);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
