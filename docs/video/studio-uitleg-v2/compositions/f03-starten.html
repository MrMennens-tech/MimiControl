<!doctype html>
<html lang="nl">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="f03-starten-template">
      <style>
        #f03-laag { position: absolute; inset: 0; }
      </style>
      <div id="f03-starten" data-composition-id="f03-starten" data-width="1920" data-height="1080">
        <div class="sc-in" id="f03-in">
          <div id="f03-laag" data-layout-allow-occlusion><div class="cam" id="f03-cam"></div></div>
          <div class="hfd-groot" id="f03-hg"><div class="kick">Begin</div><div class="tit">Programma starten</div></div>
          <div class="hfd-klein" id="f03-hk"><span class="kick">Begin</span><span>Programma starten</span></div>
        </div>
      </div>
      <script>
        (function () {
          var ID = "f03-starten";
          var tl = UI.tijdlijn();
          var root = document.getElementById("f03-in");
          var T = UI.tijden(ID);
          var $ = function (s) { return root.querySelector(s); };
          var cam = $("#f03-cam");
          var da = Studio.dashboard("f03", { welkom: true }), map = Studio.verkenner("f03"),
            vr = Studio.vraag("f03"), ml = Studio.melding("f03");
          [da.el, map.el, vr.el, ml.el].forEach(function (e) { cam.appendChild(e); });
          UI.boven(vr.el); UI.boven(ml.el); UI.boven(da.el);
          var ring = UI.h('<div class="ring" style="left:1278px;top:268px;width:268px;height:46px;border-width:3px;border-radius:12px"></div>');
          cam.appendChild(ring);
          var R = new UI.Regie(tl, root, { cursor: [1250, 820] });

          var d1 = T.c("klikDubbel1"), d2 = T.c("klikDubbel2"), ja1 = T.c("klikJa1"), ja2 = T.c("klikJa2");

          R.hoofdstuk($("#f03-hg"), $("#f03-hk"), 0.1, 1.2);
          tl.set([da.el, vr.el, ml.el], { opacity: 0 }, 0);
          R.in(map.el, 1.45, { y: 30, s: 0.98, dur: 0.7 });

          // 1. dubbelklik op het programma
          R.camera([372, 330, 900, 160], 1.9, 1.1);
          R.naar(603, 422, d1 - 0.1, 0.9);
          R.klik(d1).klik(d2);
          tl.set("#f03-exe", { backgroundColor: "rgba(0,0,0,0)" }, 0);
          tl.set("#f03-exe", { backgroundColor: "#D7EFF1" }, d1);

          // 2. vraag: opnieuw starten als beheerder
          var vraagt = T.w("vraagt");
          R.camera({ x: 0, y: 0, s: 1 }, vraagt - 1.1, 0.9);
          tl.fromTo(map.el, { opacity: 1 }, { opacity: 0.4, duration: 0.5, ease: "none", immediateRender: false }, vraagt - 0.9);
          R.in(vr.el, vraagt - 0.75, { y: 20, s: 0.96, dur: 0.5, vooraf: false });
          R.camera(vr.r.venster, vraagt - 0.3, 1.0);
          R.naar(1168, 626, ja1 - 0.1, 1.0);
          R.klik(ja1, $("#f03-ja"));
          tl.fromTo(vr.el, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.97, duration: 0.25, ease: "power2.in", immediateRender: false }, ja1 + 0.2);

          // 3. Windows-melding
          R.in(ml.el, ja1 + 0.35, { y: 20, s: 0.96, dur: 0.45, vooraf: false });
          R.camera([520, 240, 880, 440], ja1 + 0.2, 0.8);
          R.naar(1069, 577, ja2 - 0.1, 0.7);
          R.klik(ja2, $("#f03-mja"));
          tl.fromTo(ml.el, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.97, duration: 0.25, ease: "power2.in", immediateRender: false }, ja2 + 0.25);
          tl.fromTo(map.el, { opacity: 0.4 }, { opacity: 0, duration: 0.3, ease: "none", immediateRender: false }, ja2 + 0.3);
          R.toonCursor(ja2 + 0.5, false);

          // 4. dashboard: Beheerder: ja
          R.in(da.el, ja2 + 0.55, { y: 24, s: 0.98, dur: 0.7, vooraf: false });
          R.camera({ x: 0, y: 0, s: 1 }, ja2 + 0.35, 1.0);
          R.camera([1270, 230, 416, 196, 1100, 560], T.w("dashboard") - 0.2, 1.2);
          var bh = T.w("beheerder", 2);
          tl.set(ring, { opacity: 0, scale: 1.12 }, 0);
          tl.fromTo(ring, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, bh - 0.1);
          tl.fromTo("#f03-beheerder", { scale: 1 }, { scale: 1.06, duration: 0.25, ease: "power2.out", immediateRender: false, transformOrigin: "0% 50%" }, bh + 0.05);
          tl.fromTo("#f03-beheerder", { scale: 1.06 }, { scale: 1, duration: 0.35, ease: "power2.inOut", immediateRender: false, transformOrigin: "0% 50%" }, bh + 0.3);

          // de vensterlaag pas tonen als de grote titel weg is
          tl.set("#f03-laag", { opacity: 0 }, 0);
          tl.fromTo("#f03-laag", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none", immediateRender: false }, 1.3);
          R.fade(root, T.duur);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
